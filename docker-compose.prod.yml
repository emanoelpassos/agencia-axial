# Landing page da AXIAL (agenciaaxial.com.br) no stepsserver.
# Sem "ports:": o acesso público é só pelo Cloudflare Tunnel (container cloudflared),
# que alcança este container pelo nome na rede do Nginx Proxy Manager.
services:
  web:
    image: nginx:1.27-alpine
    container_name: agencia-axial-landingpage
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - npm

networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
