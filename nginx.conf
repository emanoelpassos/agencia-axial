server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx
    server_tokens off;

    # IP real do visitante (o tunnel conecta de dentro da rede Docker)
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML sempre revalidado (deploy novo aparece na hora)
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Ícones, imagens e JS podem ficar em cache por 7 dias
    location ~* \.(js|png|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
